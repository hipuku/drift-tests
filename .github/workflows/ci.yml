name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bdd:
    runs-on: ubuntu-latest

    # Drift runs crawls as BullMQ jobs on Redis, so the suite stands up a real
    # Redis alongside — closer to production than mocking the queue.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out drift-tests
        uses: actions/checkout@v4

      # The app under test. While hipuku/drift is private, cloning needs a read
      # token (set the GH_PAT secret). Once it's public, delete the secret and
      # this falls back to the automatic GITHUB_TOKEN — no edit required.
      - name: Check out drift (app under test)
        uses: actions/checkout@v4
        with:
          repository: hipuku/drift
          token: ${{ secrets.GH_PAT || github.token }}
          path: drift

      # Match the app under test. drift declares `^20.19.0 || >=22.12.0` and
      # pins 22 in .nvmrc; booting it here on a different major would mean the
      # contract is proved against a runtime nobody ships.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: drift/.nvmrc

      - name: Install Drift
        working-directory: drift
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: drift
        run: npx playwright install --with-deps chromium

      - name: Start the Drift backend
        working-directory: drift
        env:
          REDIS_URL: redis://127.0.0.1:6379
          PORT: "3001"
          # Permit and sign delivery to the loopback webhook receiver the suite
          # stands up (the SSRF guard refuses loopback by default).
          DRIFT_WEBHOOK_ALLOWED_HOSTS: "127.0.0.1"
          DRIFT_WEBHOOK_SECRET: "drift-tests-secret"
        run: |
          npm run dev:server > ../drift-server.log 2>&1 &
          echo "waiting for Drift on :3001"
          for i in $(seq 1 45); do
            # A missing `url` is a documented, deterministic 400 — the cheapest
            # proof the API is answering, with no Redis, Playwright or network
            # involved. `discover.feature` asserts that status, so this probe is
            # a consequence of a tested rule rather than a private assumption.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/discover \
                    -H 'content-type: application/json' -d '{}')" = "400" ]; then
              echo "Drift is up"; exit 0
            fi
            sleep 1
          done
          echo "Drift did not start:"; cat ../drift-server.log; exit 1

      - name: Install the suite
        run: npm ci

      - name: Typecheck the suite
        run: npm run typecheck

      - name: Run the acceptance suite
        env:
          DRIFT_URL: http://127.0.0.1:3001
        run: npm run test:ci

      - name: Drift server log (on failure)
        if: failure()
        run: cat drift-server.log || true

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber.html
          if-no-files-found: ignore
