name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      drift_ref:
        description: "Drift tag, branch or SHA to test against. Empty means its default branch."
        required: false
        default: ""

jobs:
  bdd:
    runs-on: ubuntu-latest

    # Drift runs crawls as BullMQ jobs on Redis, so the suite stands up a real
    # Redis alongside, which is closer to production than mocking the queue.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out drift-tests
        uses: actions/checkout@v4

      # The app under test. hipuku/drift is public, so the automatic GITHUB_TOKEN
      # is enough; GH_PAT is honoured if it is set, which keeps the workflow
      # working unchanged if the repo is ever made private.
      #
      # fetch-depth: 0 brings the tags, without which `git describe` below can
      # only report a SHA.
      - name: Check out drift (app under test)
        uses: actions/checkout@v4
        with:
          repository: hipuku/drift
          ref: ${{ inputs.drift_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
          path: drift

      # A green run has to say what it proved the contract against. Nothing on
      # Drift's API reports a version, so the checkout itself is the provenance:
      # the nearest tag, or a SHA when the run is not on one.
      - name: Record the Drift version under test
        run: |
          version=$(git -C drift describe --tags --always)
          echo "DRIFT_VERSION=$version" >> "$GITHUB_ENV"
          echo "Drift under test: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      # Match the app under test. drift declares `^20.19.0 || >=22.12.0` and
      # pins 22 in .nvmrc; booting it here on a different major would mean the
      # contract is proved against a runtime nobody ships.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: drift/.nvmrc

      - name: Install Drift
        working-directory: drift
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: drift
        run: npx playwright install --with-deps chromium

      - name: Start the Drift backend
        working-directory: drift
        env:
          REDIS_URL: redis://127.0.0.1:6379
          PORT: "3001"
          # Permit and sign delivery to the loopback webhook receiver the suite
          # stands up (the SSRF guard refuses loopback by default).
          DRIFT_WEBHOOK_ALLOWED_HOSTS: "127.0.0.1"
          DRIFT_WEBHOOK_SECRET: "drift-tests-secret"
        run: |
          npm run dev:server > ../drift-server.log 2>&1 &
          echo "waiting for Drift on :3001"
          for i in $(seq 1 45); do
            # A missing `url` is a documented, deterministic 400: the cheapest
            # proof the API is answering, with no Redis, Playwright or network
            # involved. `discover.feature` asserts that status, so this probe is
            # a consequence of a tested rule rather than a private assumption.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/discover \
                    -H 'content-type: application/json' -d '{}')" = "400" ]; then
              echo "Drift is up"; exit 0
            fi
            sleep 1
          done
          echo "Drift did not start:"; cat ../drift-server.log; exit 1

      - name: Install the suite
        run: npm ci

      # The committed types are generated from Drift's openapi.yaml, and nothing
      # regenerated them, so the spec moved and they did not: two response
      # descriptions were still the pre-sweep text a month after Drift changed
      # them. Regenerating against the Drift this run cloned makes the drift
      # visible here instead of in a reader's editor.
      - name: Check the generated types against the spec
        env:
          DRIFT_SPEC: drift/openapi.yaml
        run: |
          npm run generate
          git diff --exit-code -- features/support/contract.d.ts \
            || { echo "features/support/contract.d.ts is out of date; run npm run generate"; exit 1; }

      - name: Lint the suite
        run: npm run lint

      - name: Typecheck the suite
        run: npm run typecheck

      - name: Run the acceptance suite
        env:
          DRIFT_URL: http://127.0.0.1:3001
          DRIFT_VERSION: ${{ env.DRIFT_VERSION }}
        run: npm run test:ci

      - name: Drift server log (on failure)
        if: failure()
        run: cat drift-server.log || true

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ env.DRIFT_VERSION }}
          path: reports/cucumber.html
          if-no-files-found: ignore
