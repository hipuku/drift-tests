# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request. It is not a required check: each comment is
# applied as a normal commit or answered and resolved. The path instructions below are
# the rules from ARCHITECTURE.md that a reviewer should hold this suite to.
language: en-AU
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/package-lock.json"
    - "!reports/**"
    - "!scripts/punctuation-baseline.json"
  path_instructions:
    - path: "features/**"
      instructions: >-
        The suite is black-box: it reaches Drift over HTTP and imports nothing from Drift's
        source. Flag any import from the drift repository, any assertion library or HTTP client
        other than node:assert/strict and fetch, and any scenario that depends on a public site
        rather than the local fixture site. Flag a crawl scenario that relies on link discovery
        instead of an explicit page list.
    - path: "features/support/contract.d.ts"
      instructions: >-
        Generated by npm run generate from Drift's openapi.yaml. Flag hand edits.
    - path: ".github/workflows/**"
      instructions: >-
        Flag a job without a timeout, or a wait loop with no bound on how long it can run.
    - path: "**/*.md"
      instructions: >-
        Australian English. No em dashes and no spaced hyphens. Headings are topic labels, not
        claims. No marketing language. Flag any statement the suite does not support.
chat:
  auto_reply: true
